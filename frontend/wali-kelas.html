<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoDevEnger — Ruang Wali Kelas</title>
  <meta name="description" content="Ucapan dan apresiasi siswa untuk wali kelas di Hari Guru.">
  <script>document.documentElement.classList.add('js');try{if(document.documentElement.hasAttribute('data-intro')&&!sessionStorage.getItem('cde_intro'))document.documentElement.classList.add('intro-on')}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <!-- Tailwind via CDN: cukup untuk MVP/demo. Untuk produksi, ganti dengan build Tailwind CLI. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#0A1128',panel:'#111B3D',line:'#22305F',snow:'#F4F6FF',mute:'#AAB4D4',sky:'#7DB8FF',brand:'#C81D25',glow:'#FF5A5F'},fontFamily:{display:['"Space Grotesk"','sans-serif'],sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body class="overflow-x-clip bg-ink font-sans leading-relaxed text-snow" data-page="wali-kelas">
  <div data-slot="intro"></div>
  <div data-slot="nav"></div>
  <div data-slot="overlays"></div>
  <header class="relative overflow-hidden">
    <div data-slot="hero-decor"></div>
    <div class="relative mx-auto max-w-[1120px] px-4 pb-[150px] pt-12 sm:px-6 sm:pt-[72px]">
      <span class="anim-in d1 inline-block rounded-full border border-[#2A4A94] px-3.5 py-1.5 text-[13px] font-semibold uppercase tracking-widest text-sky">Ruang Wali Kelas · Hari Guru</span>
      <h1 class="anim-in d2 mb-5 mt-6 max-w-[640px] font-display text-[clamp(38px,9vw,64px)] font-bold leading-[1.05]">Terima kasih, <span class="glowtxt text-glow">[Nama Wali Kelas]</span>.</h1>
      <p class="anim-in d3 mb-8 max-w-[520px] text-[clamp(16px,2.4vw,19px)] text-[#C9D2F0]">Ucapan, apresiasi, dan kenangan dari seluruh siswa untuk guru yang membimbing kami.</p>
      
    </div>
  </header>
  <main>
    <section id="daftar" class="mx-auto max-w-[1120px] px-4 pb-6 pt-12 sm:px-6 sm:pt-[72px]">
      
      <div class="flex flex-wrap items-center justify-between gap-3"><span class="text-[13px] font-semibold uppercase tracking-widest text-sky">Apresiasi</span></div>
      <h2 class="reveal hl font-display text-[clamp(28px,6vw,40px)] leading-[1.15] mb-0 mt-2">Ucapan dari kami</h2>
      <p class="mb-8 mt-2 max-w-[560px] text-mute">Isi dengan ucapan yang sudah disetujui admin.</p>
      <div data-list="notes" class="flex flex-wrap gap-5"></div>
    </section>
    <section class="mx-auto max-w-[1120px] px-4 pb-6 pt-12 sm:px-6 sm:pt-[72px] text-center">
      <h2 class="reveal hl font-display text-[clamp(28px,6vw,40px)] leading-[1.15] mb-3 text-[clamp(24px,5vw,32px)]">Kembali ke beranda</h2>
      <p class="mb-6 text-mute">Kenali kelas kami lebih jauh.</p>
      <a class="btn inline-block rounded-lg bg-brand px-8 py-3.5 font-semibold text-white no-underline" href="index.html">Ke Beranda</a>
    </section>
  </main>
  <div data-slot="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js" onerror="void 0"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
