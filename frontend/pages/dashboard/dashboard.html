<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoDevEnger — Dashboard</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'rgb(var(--ink)/<alpha-value>)',panel:'rgb(var(--panel)/<alpha-value>)',line:'rgb(var(--line)/<alpha-value>)',snow:'rgb(var(--snow)/<alpha-value>)',mute:'rgb(var(--mute)/<alpha-value>)',sky:'rgb(var(--sky)/<alpha-value>)',glow:'rgb(var(--glow)/<alpha-value>)',ok:'rgb(var(--ok)/<alpha-value>)',warn:'rgb(var(--warn)/<alpha-value>)',err:'rgb(var(--err)/<alpha-value>)',brand:'#C81D25'},fontFamily:{sans:['Poppins','system-ui','sans-serif']}}}}</script>
  <style type="text/tailwindcss">
    .pnl{@apply rounded-2xl border border-line bg-panel p-4 sm:p-5}
    .bp{@apply inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-brand px-5 py-2 text-sm font-semibold text-white hover:brightness-110}
    .bg2{@apply inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-line px-4 py-2 text-sm font-semibold text-snow hover:border-sky}
    .inp{@apply min-h-11 w-full rounded-xl border border-line bg-ink px-3 text-sm text-snow placeholder:text-mute}
    .mi{@apply flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm font-medium text-mute hover:bg-ink hover:text-snow}
    .mi[aria-current=page]{@apply bg-brand text-white}
    th{@apply px-3 py-2 text-left text-xs font-semibold text-mute}
    td{@apply px-3 py-2.5 text-sm}
    .search-box .search-input {
  padding-left: 44px !important;
  padding-right: 12px;
}

.search-box .search-icon {
  left: 12px;
  pointer-events: none;
}
  </style>
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="bg-ink font-sans text-snow">
  <aside id="side" class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-line bg-panel transition-transform lg:translate-x-0" aria-label="Menu utama">
    <a href="dashboard.html#/home" class="flex h-[72px] shrink-0 items-center gap-2.5 px-5 text-snow no-underline">
      <svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Logo CoDevEnger"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#C81D25"/><polygon points="16,8 22,11.5 22,20.5 16,24 10,20.5 10,11.5" fill="rgb(var(--panel))"/></svg>
      <span class="text-xl font-bold">CoDevEnger</span></a>
    <nav id="menu" class="flex-1 space-y-1 overflow-y-auto px-3 pb-6"></nav>
  </aside>
  <div id="scrim" class="fixed inset-0 z-30 hidden bg-black/60 lg:hidden" data-act="menu-close"></div>
  <div class="lg:pl-72">
    <header class="sticky top-0 z-20 flex items-center gap-2 border-b border-line bg-panel/95 px-3 py-3 backdrop-blur sm:gap-3 sm:px-6">
      <button class="bg2 !px-3 lg:hidden" data-act="menu-open" aria-label="Buka menu"><i data-lucide="menu"></i></button>
  <label class="search-box relative min-w-0 flex-1">
  <span class="sr-only">Pencarian</span>

  <i data-lucide="search"
    class="search-icon pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-mute">
  </i>

  <input
    id="q" type="search" placeholder="Pencarian..." class="inp search-input" autocomplete="off"
  >
</label>
      <script>document.write(CDE_THEME.btn())</script>
      <button class="bg2 !rounded-full !px-3 max-sm:hidden" data-act="bell" aria-label="Notifikasi"><i data-lucide="bell"></i></button>
      <div class="relative">
        <button id="pbtn" class="flex min-h-11 items-center gap-2 rounded-full border border-line bg-ink py-1 pl-1 pr-3 text-left" data-act="profile" aria-haspopup="true" aria-expanded="false">
          <span id="avatar" class="grid h-9 w-9 place-items-center rounded-full bg-brand text-sm font-bold text-white">S</span>
          <span class="hidden leading-tight sm:block"><b id="uname" class="block text-sm"></b><span id="urole" class="text-xs text-mute"></span></span></button>
        <div id="pmenu" class="absolute right-0 top-14 hidden w-56 rounded-2xl border border-line bg-panel p-2 shadow-xl">
          <p class="px-3 py-1 text-xs text-mute">Peran (simulasi)</p>
          <button class="mi w-full" data-act="role" data-v="siswa">Siswa</button>
          <button class="mi w-full" data-act="role" data-v="admin">Admin</button>
          <a class="mi" href="../landing/index.html">Mode Pengunjung</a>
          <a class="mi" href="login.html">Keluar</a></div>
      </div>
    </header>
    <main id="view" class="mx-auto max-w-[1200px] p-4 sm:p-6" tabindex="-1"></main>
  </div>
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4" data-act="modal-bg"><div id="mbody" role="dialog" aria-modal="true" class="max-h-[90vh] w-full max-w-md overflow-y-auto rounded-2xl border border-line bg-panel p-5"></div></div>
  <div id="toast" role="status" class="fixed bottom-4 left-1/2 z-[60] hidden -translate-x-1/2 rounded-xl bg-snow px-4 py-2.5 text-sm font-medium text-ink shadow-lg"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
