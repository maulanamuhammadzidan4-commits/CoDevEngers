<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoDevEnger — Masuk Anggota</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'rgb(var(--ink)/<alpha-value>)',panel:'rgb(var(--panel)/<alpha-value>)',line:'rgb(var(--line)/<alpha-value>)',snow:'rgb(var(--snow)/<alpha-value>)',mute:'rgb(var(--mute)/<alpha-value>)',sky:'rgb(var(--sky)/<alpha-value>)',brand:'#C81D25'},fontFamily:{sans:['Poppins','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="min-h-screen bg-ink font-sans text-snow">
  <div class="absolute right-4 top-4"><script>document.write(CDE_THEME.btn())</script></div>
  <main class="mx-auto grid min-h-screen max-w-[900px] items-center gap-8 px-4 py-10 md:grid-cols-2">
    <div class="relative hidden h-[420px] overflow-hidden rounded-3xl bg-[#05070f] md:block">
      <img src="assets/images/spiderman.webp" alt="Ilustrasi Spider-Man" class="h-full w-full object-cover object-[50%_20%]">
    </div>
    <section class="rounded-3xl border border-line bg-panel p-6 sm:p-8">
      <h1 class="text-2xl font-bold">Masuk Anggota</h1>
      <p class="mt-2 text-mute">Gunakan username akun CoDevEnger.</p>
      <form id="login-form" class="mt-6 grid gap-4" novalidate>
        <label class="text-sm text-mute" for="username">Username
          <input id="username" name="username" class="inp mt-1" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="contoh: nama.siswa">
        </label>
        <label class="text-sm text-mute" for="password">Password
          <span class="mt-1 flex gap-2">
            <input id="password" name="password" type="password" class="inp" autocomplete="current-password" required>
            <button id="toggle-password" type="button" class="bg2 shrink-0 !px-3" aria-label="Tampilkan password" aria-pressed="false"><i data-lucide="eye"></i></button>
          </span>
        </label>
        <p id="login-message" class="min-h-5 text-sm text-err" role="alert" aria-live="polite"></p>
        <button id="login-submit" type="submit" class="bp w-full">Masuk</button>
        <a href="../landing/index.html" class="px-1 pt-2 text-sm text-mute underline">Kembali ke mode pengunjung</a>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>if (window.lucide) window.lucide.createIcons();</script>
</body>
</html>
