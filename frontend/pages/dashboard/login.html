<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoDevEnger — Masuk Anggota</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'rgb(var(--ink)/<alpha-value>)',panel:'rgb(var(--panel)/<alpha-value>)',line:'rgb(var(--line)/<alpha-value>)',snow:'rgb(var(--snow)/<alpha-value>)',mute:'rgb(var(--mute)/<alpha-value>)',sky:'rgb(var(--sky)/<alpha-value>)',brand:'#C81D25'},fontFamily:{sans:['Poppins','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="min-h-screen bg-ink font-sans text-snow">
  <div class="absolute right-4 top-4"><script>document.write(CDE_THEME.btn())</script></div>
  <main class="mx-auto grid min-h-screen max-w-[900px] items-center gap-8 px-4 py-10 md:grid-cols-2">
    <div class="relative hidden h-[420px] overflow-hidden rounded-3xl bg-[#05070f] md:block">
      <img src="assets/images/spiderman.webp" alt="Ilustrasi Spider-Man" class="h-full w-full object-cover object-[50%_20%]">
    </div>
    <section class="rounded-3xl border border-line bg-panel p-6 sm:p-8">
      <h1 class="text-2xl font-bold">Masuk Anggota</h1>
      <p class="mt-2 text-mute">Pilih peran untuk melihat dashboard.</p>
      <p class="mt-3 rounded-lg border border-line px-3 py-2 text-sm text-mute">Ini simulasi tampilan. Autentikasi asli akan disambungkan oleh tim backend.</p>
      <div class="mt-6 grid gap-3">
        <button data-role="siswa" class="rounded-xl bg-brand px-5 py-3.5 text-left font-semibold text-white">Masuk sebagai Siswa</button>
        <button data-role="admin" class="rounded-xl border-[1.5px] border-sky px-5 py-3.5 text-left font-semibold text-sky">Masuk sebagai Admin</button>
        <a href="../landing/index.php" class="px-1 pt-2 text-sm text-mute underline">Kembali ke mode pengunjung</a>
      </div>
    </section>
  </main>
  <script>document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('cde_role',b.dataset.role)}catch(e){}location.href='dashboard.html'})</script>
</body>
</html>
