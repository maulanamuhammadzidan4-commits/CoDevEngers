<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoDevEnger — Ganti Password</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'rgb(var(--ink)/<alpha-value>)',panel:'rgb(var(--panel)/<alpha-value>)',line:'rgb(var(--line)/<alpha-value>)',snow:'rgb(var(--snow)/<alpha-value>)',mute:'rgb(var(--mute)/<alpha-value>)',sky:'rgb(var(--sky)/<alpha-value>)',brand:'#C81D25',ok:'rgb(var(--ok)/<alpha-value>)',warn:'rgb(var(--warn)/<alpha-value>)',err:'rgb(var(--err)/<alpha-value>)'},fontFamily:{sans:['Poppins','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="min-h-screen bg-ink font-sans text-snow">
  <div class="absolute right-4 top-4"><script>document.write(CDE_THEME.btn())</script></div>
  <main class="mx-auto grid min-h-screen max-w-[900px] items-center gap-8 px-4 py-10 md:grid-cols-2">
    <div class="relative hidden h-[420px] overflow-hidden rounded-3xl bg-[#05070f] md:block">
      <img src="assets/images/spiderman.webp" alt="Ilustrasi Spider-Man" class="h-full w-full object-cover object-[50%_20%]">
    </div>
    <section class="rounded-3xl border border-line bg-panel p-6 sm:p-8">
      <h1 class="text-2xl font-bold">Ganti Password</h1>
      <p class="mt-2 text-mute">Password baru diperlukan sebelum membuka dashboard.</p>
      <form id="change-password-form" class="mt-6 grid gap-4" novalidate>
        <label class="text-sm text-mute" for="new-password">Password baru
          <span class="mt-1 flex gap-2">
            <input id="new-password" type="password" class="inp" autocomplete="new-password" minlength="6" required>
            <button id="toggle-new" type="button" class="bg2 shrink-0 !px-3" aria-label="Tampilkan password" aria-pressed="false">Lihat</button>
          </span>
        </label>
        <div aria-label="Kekuatan password">
          <div class="h-2 overflow-hidden rounded-full bg-line"><div id="strength-bar" class="h-full w-0 bg-err transition-all"></div></div>
          <p id="strength-text" class="mt-1 text-xs text-mute">Gunakan minimal 6 karakter.</p>
        </div>
        <label class="text-sm text-mute" for="confirm-password">Konfirmasi password
          <input id="confirm-password" type="password" class="inp mt-1" autocomplete="new-password" minlength="6" required>
        </label>
        <p id="change-message" class="min-h-5 text-sm text-err" role="alert" aria-live="polite"></p>
        <button id="change-submit" type="submit" class="bp w-full">Simpan password</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-change-password.js"></script>
</body>
</html>
